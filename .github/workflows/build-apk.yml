name: Build test APK

# Builds a release APK of the app on GitHub's free runners and uploads it as a
# downloadable artifact. No Expo/EAS cloud builds are used, so this consumes
# zero Expo build credits. The APK is built with APP_VARIANT=test, giving it
# the name "PrayerCircle Test" and its own package id so it installs
# alongside the production app without a signature clash.
#
# NOTE: this must be a *release* build (assembleRelease). A debug build does
# not bundle the JS, so the app would crash on launch looking for a dev
# server. The APK is built UNSIGNED (android/ is gitignored and regenerated
# by expo prebuild, so a workflow step patches the generated build.gradle:
# versionCode = this run's number, release signingConfig removed). The
# unsigned APK is signed locally with the permanent PrayerCircle key before
# release, so every build installs over the previous one.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: test
      # Ensures the JS is bundled in production mode.
      NODE_ENV: production
      # API.Bible key for the in-app chapter reader (repo secret, never hardcoded).
      EXPO_PUBLIC_APIBIBLE_KEY: ${{ secrets.EXPO_PUBLIC_APIBIBLE_KEY }}
      # Backend API base URL for tRPC (chapter summaries, etc.). Temporary Manus
      # sandbox endpoint until a permanent backend is deployed (repo secret).
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      CI: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Prepare unsigned release build
        run: |
          python3 - <<'PYEOF'
          import re, sys
          path = "android/app/build.gradle"
          src = open(path).read()

          version_code = "${{ github.run_number }}"
          src, n = re.subn(r"versionCode\s+\d+", "versionCode " + version_code, src, count=1)
          if n != 1:
              sys.exit("versionCode not found in generated build.gradle")

          lines = src.splitlines(keepends=True)
          out = []
          in_release = False
          depth = 0
          removed = 0
          for line in lines:
              if not in_release and re.match(r"\s*release\s*\{\s*$", line):
                  in_release = True
                  depth = 1
                  out.append(line)
                  continue
              if in_release:
                  depth += line.count("{") - line.count("}")
                  if depth <= 0:
                      in_release = False
                      out.append(line)
                      continue
                  if line.strip() == "signingConfig signingConfigs.debug":
                      removed += 1
                      continue
              out.append(line)
          if removed != 1:
              sys.exit("expected exactly 1 release signingConfig to remove, got %d" % removed)
          open(path, "w").write("".join(out))
          print("build.gradle patched: versionCode=" + version_code + ", release signingConfig removed")
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Note: ubuntu-latest runners already ship with the Android SDK
      # (ANDROID_SDK_ROOT is pre-set), so no SDK setup step is needed.

      - name: Build release APK (unsigned)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prayercircle-test-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
