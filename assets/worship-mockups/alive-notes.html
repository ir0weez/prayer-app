<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 20px; margin: 0; }
  h2 { font-size: 16px; color: #333; margin: 24px 0 12px; }
  .card {
    background: #fff;
    border: 1.5px solid #22C55E;
    border-radius: 12px;
    padding: 12px 14px;
    max-width: 400px;
    position: relative;
    overflow: hidden;
    min-height: 80px;
  }
  .chip {
    display: inline-block;
    background: #22C55E;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .title { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 2px; }
  .time { font-size: 12px; color: #888; }
  .label { font-size: 11px; color: #999; margin-top: 8px; max-width: 400px; }

  .notes-area {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 140px;
    overflow: hidden;
    pointer-events: none;
  }
  .note {
    position: absolute;
    bottom: -20px;
    color: #22C55E;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.7; }
    50% { transform: translateY(-45px) translateX(6px); opacity: 0.5; }
    90% { opacity: 0.2; }
    100% { transform: translateY(-90px) translateX(-4px); opacity: 0; }
  }
  /* Current: 3 notes, uniform */
  .current .note:nth-child(1) { left: 20px; font-size: 22px; animation-duration: 2.1s; animation-delay: 0s; }
  .current .note:nth-child(2) { left: 55px; font-size: 19px; animation-duration: 2.1s; animation-delay: 0.7s; }
  .current .note:nth-child(3) { left: 90px; font-size: 22px; animation-duration: 2.1s; animation-delay: 1.4s; }

  /* Alive: 6 notes, varied */
  .alive .note:nth-child(1) { left: 10px; font-size: 18px; animation-duration: 2.8s; animation-delay: 0s; }
  .alive .note:nth-child(2) { left: 35px; font-size: 28px; animation-duration: 1.9s; animation-delay: 0.4s; }
  .alive .note:nth-child(3) { left: 60px; font-size: 20px; animation-duration: 2.4s; animation-delay: 0.9s; }
  .alive .note:nth-child(4) { left: 85px; font-size: 32px; animation-duration: 2.1s; animation-delay: 1.3s; }
  .alive .note:nth-child(5) { left: 110px; font-size: 16px; animation-duration: 3.1s; animation-delay: 1.7s; }
  .alive .note:nth-child(6) { left: 48px; font-size: 24px; animation-duration: 2.6s; animation-delay: 2.1s; }
</style>
</head>
<body>

<h2>Current (3 notes, uniform)</h2>
<div class="card">
  <div class="chip">♪ Worship</div>
  <div class="title">Album</div>
  <div class="time">11:00 PM</div>
  <div class="notes-area current">
    <span class="note">♪</span>
    <span class="note">♫</span>
    <span class="note">♪</span>
  </div>
</div>

<h2>Alive (6 notes, varied size/speed/drift)</h2>
<div class="card">
  <div class="chip">♪ Worship</div>
  <div class="title">Album</div>
  <div class="time">11:00 PM</div>
  <div class="notes-area alive">
    <span class="note">♪</span>
    <span class="note">♫</span>
    <span class="note">♪</span>
    <span class="note">♫</span>
    <span class="note">♪</span>
    <span class="note">♫</span>
  </div>
</div>
<div class="label">More notes, different sizes, different speeds, drifting side to side, fading in and out. Same card, same border, just alive.</div>

</body>
</html>
